# Checks every pull request and push. Deploys main to Firebase Hosting once the
# FIREBASE_SERVICE_ACCOUNT_SADROBOTSONLINE secret has been added to this repository.
name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Check for the deploy key
        id: key
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SADROBOTSONLINE }}
        run: |
          if [ -n "$KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::No Firebase deploy key yet, so this run only builds and tests."; fi
      - if: steps.key.outputs.present == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SADROBOTSONLINE }}
          projectId: sadrobotsonline
          channelId: live
